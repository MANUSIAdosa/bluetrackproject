name: blue_track
description: "BlueTrack — marine conservation and transparent donation platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.5
  fl_chart: ^1.3.0
  flutter_form_builder: ^11.0.0
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  lottie: ^3.6.1
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/images/interests/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 800
